<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#050506">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<link rel="apple-touch-icon"
      href="./icons/icon-192.png">

<title>Mini Arcade</title>
<link rel="icon" type="image/png" href="https://sifat8668.github.io/mini-arcade/icon.png">
<style>
/* ============ NEUMORPHIC THEME ============ */
:root{
  --bg:#e7ecf5;
  --t:#3a416b;
  --m:#8892b4;
  --ac:#6c7cff;
  --on:#ffffff;
  --sd:rgba(163,177,198,.75);
  --sl:#ffffff;
  --ov:rgba(231,236,245,.62);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --r:18px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#272b37;--t:#e8ecf9;--m:#8e97b6;--ac:#7cf0ff;--on:#06202a;
    --sd:rgba(0,0,0,.6);--sl:rgba(255,255,255,.06);--ov:rgba(22,26,35,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#272b37;--t:#e8ecf9;--m:#8e97b6;--ac:#7cf0ff;--on:#06202a;
  --sd:rgba(0,0,0,.6);--sl:rgba(255,255,255,.06);--ov:rgba(22,26,35,.62);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;overflow:hidden;color:var(--t);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:background .6s var(--ease),color .6s var(--ease);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% 12%,rgba(120,150,255,.14),transparent 45%),
    radial-gradient(circle at 88% 88%,rgba(255,120,200,.12),transparent 45%);
  transition:opacity .6s var(--ease);
}

/* ---- soft surface ---- */
.gl{
  background:var(--bg);border:0;border-radius:var(--r);
  box-shadow:9px 9px 22px var(--sd),-9px -9px 22px var(--sl);
  transition:box-shadow .45s var(--ease),transform .45s var(--ease),
             background .6s var(--ease),color .6s var(--ease);
}

/* ---- buttons ---- */
button{
  font:inherit;color:inherit;cursor:pointer;
  border:0;background:var(--bg);border-radius:14px;padding:9px 16px;
  box-shadow:5px 5px 13px var(--sd),-5px -5px 13px var(--sl);
  transition:box-shadow .35s var(--ease),transform .3s var(--ease-spring),
             color .35s var(--ease),background .6s var(--ease);
}
button:hover{box-shadow:7px 7px 18px var(--sd),-7px -7px 18px var(--sl);transform:translateY(-2px)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
button.on{
  color:var(--ac);
  box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl);
}
button.on:hover{box-shadow:inset 6px 6px 14px var(--sd),inset -6px -6px 14px var(--sl);transform:translateY(0)}
button:active,button.on:active{
  box-shadow:inset 6px 6px 14px var(--sd),inset -6px -6px 14px var(--sl);
  transform:translateY(1px) scale(.97);
}
button:disabled,button:disabled:hover{
  cursor:default;transform:none;opacity:.8;
  box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl);
}

body.np #menu,body.np #stage{visibility:hidden}

/* ============ MENU ============ */
#menu{
  height:100%;display:flex;flex-direction:column;gap:10px;
  padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));
  animation:fadeIn .5s var(--ease-out) backwards;
}
#menu[hidden]{display:none}
.top{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 16px;border-radius:22px;
  animation:fadeUp .55s var(--ease-out) backwards;
}
.top h1{
  font-size:20px;margin:0;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--ac),#c06cff);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.top label{color:var(--m);font-size:13px}
#q{
  flex:1;min-width:130px;padding:10px 16px;border-radius:14px;border:0;
  background:var(--bg);color:var(--t);font:inherit;
  -webkit-appearance:none;appearance:none;
  -webkit-user-select:text;user-select:text;
  box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl);
  transition:box-shadow .35s var(--ease),background .6s var(--ease),color .6s var(--ease);
}
#q::placeholder{color:var(--m)}
#q:focus{outline:none;box-shadow:inset 6px 6px 14px var(--sd),inset -6px -6px 14px var(--sl)}
#q:focus-visible{outline:2px solid var(--ac);outline-offset:3px}

#lv{display:flex;gap:6px}
#lv button{padding:6px 13px;font-size:13px}

#chips{
  display:flex;gap:10px;overflow-x:auto;padding:6px 4px 12px;flex:none;
  scrollbar-width:none;scroll-behavior:smooth;
}
#chips::-webkit-scrollbar{display:none}
#chips button{white-space:nowrap;padding:7px 16px;border-radius:999px;font-size:13px}

#grid{
  flex:1;overflow:auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;align-content:start;padding:6px 8px 28px;
  scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--sd) transparent;
  animation:fadeIn .6s var(--ease-out) backwards;
}
#grid::-webkit-scrollbar{width:10px}
#grid::-webkit-scrollbar-track{background:transparent}
#grid::-webkit-scrollbar-thumb{background:var(--sd);border-radius:10px}

.gc{
  padding:20px 14px;text-align:center;cursor:pointer;border-radius:20px;
  transition:transform .45s var(--ease-out),box-shadow .45s var(--ease),background .6s var(--ease);
  animation:cardIn .32s var(--ease-out) backwards;
}
.gc:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:13px 13px 28px var(--sd),-13px -13px 28px var(--sl);
}
.gc:active{
  transform:translateY(-2px) scale(.985);
  box-shadow:inset 6px 6px 14px var(--sd),inset -6px -6px 14px var(--sl);
}
.gc b{
  display:block;font-size:38px;margin-bottom:8px;line-height:1;
  transition:transform .5s var(--ease-spring);
}
.gc:hover b{transform:scale(1.16) rotate(-5deg)}
.gc small{color:var(--m);font-size:12px}

/* ============ STAGE ============ */
#stage{position:fixed;inset:0;display:none;background:var(--bg);color:var(--t)}
#stage.on{display:block;animation:stageIn .45s var(--ease-out) backwards}
#view{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#view canvas{
  display:block;border-radius:20px;
  box-shadow:0 22px 45px rgba(35,45,85,.28),0 3px 10px rgba(35,45,85,.16);
  animation:canvasIn .5s var(--ease-out) backwards;
}
#bk{
  position:absolute;z-index:5;
  top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));
  border-radius:14px;
  animation:slideInLeft .5s var(--ease-out) backwards;
}
#hud{
  position:absolute;z-index:5;
  top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  padding:9px 18px;font-weight:700;border-radius:14px;pointer-events:none;
  box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl);
  animation:fadeIn .5s var(--ease-out) backwards;
}
#hud:empty{display:none}

#ov{
  position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
  background:var(--ov);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
  backdrop-filter:blur(10px) saturate(140%);
}
#ov.on{display:flex;animation:fadeIn .35s var(--ease) backwards}

.pn{
  padding:26px 30px;text-align:center;border-radius:26px;
  animation:popIn .45s var(--ease-spring) backwards;
}
.pn h2{margin:0 0 10px;font-size:22px;letter-spacing:.2px}
.pn p{margin:0 0 14px;color:var(--m)}

/* ---- in-game panels built by games ---- */
.ctr{display:flex;align-items:center;justify-content:center;height:100%;padding:10px}
.bd{display:grid;grid-template-columns:repeat(3,min-content);gap:12px;margin:14px 0;justify-content:center}
.bd button,.big{
  width:min(19vh,84px);height:min(19vh,84px);font-size:min(10vh,42px);
  padding:0;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
}
.bd button.w{
  color:var(--ac);
  box-shadow:inset 6px 6px 14px var(--sd),inset -6px -6px 14px var(--sl);
}
.vs{
  font-size:min(13vh,54px);display:flex;gap:44px;justify-content:center;align-items:center;
  margin:10px 0;
}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
@keyframes mkIn{0%{transform:scale(.3) rotate(-35deg);opacity:0}60%{transform:scale(1.18) rotate(6deg);opacity:1}100%{transform:none}}
@keyframes wn{0%,100%{transform:none}50%{transform:scale(1.12)}}
.bd button.pop{animation:mkIn .42s var(--ease-spring)}
.bd button.w{animation:wn .7s var(--ease) 2}
.bd button.pop.w{animation:mkIn .42s var(--ease-spring),wn .7s var(--ease) .42s 2}

/* ============ GATE ============ */
#gate{
  position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  padding:20px;text-align:center;color:var(--t);background:var(--bg);
}
#gate.on{display:flex;animation:fadeIn .4s var(--ease) backwards}
#gate .pn{max-width:340px}
#gate i{
  display:block;font-size:56px;font-style:normal;margin-bottom:8px;
  animation:rot 2.4s var(--ease) infinite;
}
#hint{color:var(--m);font-size:13px;margin-top:12px;min-height:16px}

/* ============ KEYFRAMES ============ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes stageIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes canvasIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
  #gate i{animation:none}
}

#hp{position:absolute;z-index:6;top:max(12px,env(safe-area-inset-top));left:130px;width:44px;height:44px;min-width:0;padding:0;border-radius:50%;font:800 20px/1 system-ui;display:flex;align-items:center;justify-content:center;animation:fadeIn .5s var(--ease-out) backwards}
#hv{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(8,10,22,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .28s ease}
#hv.on{opacity:1;pointer-events:auto}
#hv .pn{max-width:min(620px,92vw);max-height:86vh;overflow:auto;text-align:left;-webkit-overflow-scrolling:touch;transform:translateY(16px) scale(.96);transition:transform .34s cubic-bezier(.22,.61,.36,1)}
#hv.on .pn{transform:none}
#hv .pn p{margin:0 0 10px;line-height:1.45;font-size:15px}
#hv .pn button{margin-top:6px}
/* ============ GLASSMORPHIC THEME (black & white) ============ */
:root:root:root{--bg:#050506;--t:#f5f5f7;--m:#a1a1aa;--ac:#fff;--on:#000;--sd:rgba(0,0,0,.55);--sl:rgba(255,255,255,.04);--ov:rgba(0,0,0,.5)}
body{background:radial-gradient(900px 520px at 12% -5%,rgba(255,255,255,.13),transparent 60%),radial-gradient(760px 520px at 100% 105%,rgba(255,255,255,.09),transparent 60%),#050506!important;color:var(--t)}
.gl,.gc,.pn,#hud,#q,#bk,#hp,#chips button,#lv button,button{background:rgba(255,255,255,.07)!important;-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,.17)!important;box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)!important;color:var(--t);transition:transform .25s var(--ease-out),background .25s var(--ease),box-shadow .25s var(--ease)}
.gc:hover,button:hover{background:rgba(255,255,255,.14)!important;transform:translateY(-2px)}
.gc:active,button:active{transform:scale(.97)}
button.on,#chips button.on,#lv button.on{background:#fff!important;color:#000!important;border-color:#fff!important}
#gate,#ov,#hv{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@media(max-width:760px),(prefers-reduced-motion:reduce){.gl,.gc,.pn,#hud,#q,#bk,#hp,button{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}*{scroll-behavior:auto}}
.gc{content-visibility:auto;contain-intrinsic-size:auto 96px}
.q0 *,.q0 *::before,.q0 *::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.q0 #ov{background:rgba(6,8,18,.7)}.q0 #hv{background:rgba(6,8,18,.82)}
.q1 .gl,.q1 .gc,.q1 .pn,.q1 #hud,.q1 #q,.q1 #bk,.q1 #hp,.q1 button{-webkit-backdrop-filter:blur(8px)!important;backdrop-filter:blur(8px)!important}
#hv .pn{overflow-x:hidden;overflow-wrap:anywhere;width:min(620px,92vw)}
#hv .pn h2{font-size:clamp(16px,4vh,24px)}
#hud{color:#fff!important;background:rgba(8,12,20,.82)!important;text-shadow:0 1px 2px #000}
#view canvas{touch-action:none}
</style></head>
<body class="np">
<div id="gate"><div class="pn gl"><i>📱</i><h2>Landscape required</h2><p>Turn your device sideways to play. We try to switch automatically.</p><button id="go" class="on">Go Landscape</button><div id="hint"></div></div></div>
<div id="menu"><div class="top gl"><h1>Mini Arcade</h1><input id="q" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games"><label>Bot level</label><div id="lv"></div></div><div id="chips"></div><div id="grid"></div></div>
<div id="stage"><div id="view"></div><button id="bk">← Menu</button><div id="hud" class="gl"></div><div id="ov"></div><button id="hp" aria-label="How to play" title="How to play">?</button><div id="hv"></div></div>

<script>
const $=s=>document.querySelector(s),ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const LV=["Easy","Medium","Hard","Expert"],GAMES=[],L=()=>innerWidth>innerHeight,shuf=()=>{for(let i=GAMES.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[GAMES[i],GAMES[j]]=[GAMES[j],GAMES[i]]}};let PZ=0,CUR=null;
const S={lv:Math.min(3,Math.max(0,+(ls("lv")??2)||0)),tag:"All",q:""};

/* ===== BOTS: work with any game you add =====
 Turn-based game: give addGame() a rules object {moves(s),play(s,m),turn(s),score(s,p),heur?(s,p)}
   moves: legal moves | play: returns NEW state | turn: player to move | score: null while running, else 1 win / 0 draw / -1 loss for player p
   heur: optional estimate in [-1,1] for unfinished positions. Then call BOT.pick(rules,state,level) to get a move.
 Simultaneous game (like rock paper scissors): BOT.predict(opponentHistory,numMoves,level) predicts the opponent next move. */
const BOT={
 pick(R,s,lv){const ms=R.moves(s);if(Math.random()<[.45,.15,.03,0][lv])return ms[Math.random()*ms.length|0];
  const me=R.turn(s),end=performance.now()+[80,150,300,600][lv];let hit=0,best=ms[0];
  const mm=(s,d,a,b)=>{if(hit||performance.now()>end){hit=1;return 0}
   const t=R.score(s,me);if(t!=null)return t*(1+d/50);if(!d)return R.heur?R.heur(s,me):0;
   const mx=R.turn(s)==me;let v=mx?-9:9;
   for(const m of R.moves(s)){const x=mm(R.play(s,m),d-1,a,b);if(mx){if(x>v)v=x;if(v>a)a=v}else{if(x<v)v=x;if(v<b)b=v}if(a>=b)break}
   return v};
  for(let D=1;D<=[1,3,5,12][lv]&&!hit;D++){let bv=-9,bl=[];
   for(const m of ms){const x=mm(R.play(s,m),D-1,-9,9);if(hit)break;if(x>bv){bv=x;bl=[m]}else if(x==bv)bl.push(m)}
   if(!hit)best=bl[Math.random()*bl.length|0]}
  return best},
 predict(h,n,lv){if(Math.random()<[.7,.35,.08,0][lv]||h.length<2)return Math.random()*n|0;
  const sc=Array(n).fill(0),dc=lv>1?1:0;
  h.forEach((m,i)=>sc[m]+=dc?.92**(h.length-1-i):1);
  for(let k=1;k<=lv;k++)for(let i=k;i<h.length;i++)if(h.slice(i-k,i).join()==h.slice(-k).join())sc[h[i]]+=k*3*(dc?.95**(h.length-1-i):1);
  const mx=Math.max(...sc),c=sc.flatMap((v,i)=>v>=mx-1e-9?[i]:[]);return c[Math.random()*c.length|0]}
};

/* Quality tier from device memory and CPU cores: 0 low, 1 medium, 2 high */
const QL=(()=>{const m=navigator.deviceMemory||(/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?3:8),k=navigator.hardwareConcurrency||4;return m<=2||k<=2?0:m<=4||k<=4?1:2})();document.documentElement.classList.add("q"+QL);
const ld3=()=>window.THREE?Promise.resolve():(window._t3=window._t3||new Promise(ok=>{const e=document.createElement("script");e.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";e.onload=ok;e.onerror=()=>{window._t3=0;ok()};document.head.appendChild(e)}));
/* ===== Platform ===== */
const stage=$("#stage"),view=$("#view"),hud=$("#hud"),ov=$("#ov");let offs=[];
const clean=()=>{offs.forEach(f=>f());offs=[];view.innerHTML="";ov.className="";ov.innerHTML="";hud.textContent="";PZ=0;$("#hv").className=""};
const exit=()=>{clean();stage.classList.remove("on");$("#menu").hidden=false;shuf();render()};
$("#bk").onclick=exit;
function play(g,P,W3){clean();$("#menu").hidden=true;stage.classList.add("on");CUR=g;{const b=$("#bk");$("#hp").style.left=b.offsetLeft+b.offsetWidth+10+"px"}if(g.tags.includes("3D")&&!window.THREE&&!W3){hud.textContent="Loading 3D…";return ld3().then(()=>{if(CUR===g&&stage.classList.contains("on"))play(g,P,1)})}if(g.mp&&!P)return lobby(g);
 const on=(t,e,f,o)=>{const guarded=v=>{if(!PZ||["keyup","pointerup","pointercancel","blur"].includes(e))f(v)};t.addEventListener(e,guarded,o);offs.push(()=>t.removeEventListener(e,guarded,o))};
 const C={el:view,lv:S.lv,pl:P,on,
  t:(f,ms)=>{let i;const fire=()=>{if(PZ){i=setTimeout(fire,100);return}f()};i=setTimeout(fire,ms);offs.push(()=>clearTimeout(i))},
  run:fn=>{let last=performance.now(),id;const f=t=>{id=requestAnimationFrame(f);const dt=Math.min(.05,(t-last)/1000);last=t;if(L()&&!document.hidden&&!PZ)fn(dt)};id=requestAnimationFrame(f);offs.push(()=>cancelAnimationFrame(id))},
  hud:s=>{s=String(s);if(hud.textContent!==s)hud.textContent=s},
  over:(msg,sc)=>{let b="";if(sc!=null){const k="b_"+g.id,o=+ls(k)||0;if(sc>o){ls(k,sc);b="New best!"}else b="Best "+o}
   ov.innerHTML=`<div class="pn gl"><h2>${msg}</h2><div style="color:var(--m);margin-bottom:14px">${b}</div><button id="ag" class="on">Play again</button> <button id="mn">Menu</button></div>`;ov.className="on";$("#ag").onclick=()=>play(g,P);$("#mn").onclick=exit},
  canvas:(W,H)=>{const cv=document.createElement("canvas");cv.width=W;cv.height=H;view.appendChild(cv);
   const fit=()=>{const k=Math.min(view.clientWidth/W,view.clientHeight/H);cv.style.width=W*k+"px";cv.style.height=H*k+"px"};fit();on(window,"resize",fit);return[cv,cv.getContext("2d")]},

 move=(dx,dy)=>{if(done||busy)return;const X=P[0]+dx,Y=P[1]+dy;if(X<0||Y<0||X>=N||Y>=N||Wl[id(X,Y)])return;const pi=Ph.findIndex(q=>q[0]==X&&q[1]==Y);

<script>
const HELP={"ttt": "<p><b>How to play<\/b><br>you are X, the bot is O. Starter alternates each round.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "rps": "<p><b>How to play<\/b><br>Rock beats Scissors, Scissors beats Paper, Paper beats Rock. Tap your pick each round. Higher bot levels learn your habits, so mix up your choices.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "bird": "<p><b>How to play<\/b><br>tap, click or press Space to flap through the gaps.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "shots": "<p><b>How to play<\/b><br>a power meter sweeps back and forth. Tap to shoot when the dotted arc meets the hoop. 3 misses end the game.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "drift": "<p><b>How to play<\/b><br>the car drives on its own. Tap to switch direction at every corner. Miss a corner and you fall.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "snow": "<p><b>How to play<\/b><br>steer left and right (arrow keys, A/D, or hold the left/right half of the screen). Dodge trees, grab gifts.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "mem": "<p><b>How to play<\/b><br>flip two cards, matches keep your turn. Bots remember cards according to bot level.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "snake": "<p><b>How to play<\/b><br>swipe, arrow keys or WASD. Eat apples, avoid walls and yourself.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "chess": "<p><b>How to play<\/b><br>full piece movement, check, checkmate, stalemate and pawn promotion (to queen). Bot uses the shared BOT.pick search.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "darts": "<p><b>How to play<\/b><br>a crosshair sways over a real board layout. Tap to throw. Doubles, trebles and bull score like the real thing.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "archery": "<p><b>How to play<\/b><br>hold to draw the bow, release to shoot. Wind pushes the arrow, a longer draw means less drop, holding too long tires your arm.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "throw": "<p><b>How to play<\/b><br>drag back and let go to throw the ball. Knock the cans off the stand. Cans fall, roll and topple each other.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "pool": "<p><b>How to play<\/b><br>drag back from the cue ball and release to shoot. Pot all nine balls in as few shots as you can. Scratching costs a penalty.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "race": "<p><b>How to play<\/b><br>steer with Up/Down, W/S or by dragging. Tap the NITRO corner or press Space for a boost. 4 cars, 7000m.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "foot": "<p><b>How to play<\/b><br>penalty shootout, 5 kicks each. Tap inside the goal to aim. Keeper skill follows bot level.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "wordle": "<p><b>How to play<\/b><br>six tries, 5-letter words. Green = right spot, yellow = wrong spot, grey = not in the word. Type or use the keyboard.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "dino": "<p><b>How to play<\/b><br>Space / Up / tap to jump (hold = higher), Down / swipe down to duck. Day turns to night as you go.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "boba": "<p><b>How to play<\/b><br>customers order tea + topping + sugar. Build it, tap Serve. Faster service and combos earn more.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "triad": "<p><b>How to play<\/b><br>place a card; any touching enemy card with a lower facing number flips to you. Most cards at the end wins.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "pazaak": "<p><b>How to play<\/b><br>reach 20 without going over. Each turn you draw 1-10, may play one side card (+/-), then end turn or stand. First to 3 sets wins.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "fillet": "<p><b>How to play<\/b><br>watch the knife stab between the fingers, then repeat the pattern. Tap the gaps (or keys 1-4). Three cuts and you're out.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "bump": "<p><b>How to play<\/b><br>arena shrinks over time. Drag (or WASD / arrows) to roll, double-tap or Space to dash. Be the last ball on the platform.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "bed": "<p><b>How to play<\/b><br>break the enemy bed, then knock them into the void. Drag (or WASD) to move: blocks bridge the gap automatically. Swords hit nearby enemies and beds.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "fuzion": "<p><b>How to play<\/b><br>three party mini-games (Button Sprint, Coin Rush, Dodge Frenzy) against 3 bots. 4/3/2/1 points per round.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "sudoku": "<p><b>How to play<\/b><br>tap a cell, then a number (or type 1-9). Red = wrong. Hint reveals the selected cell (costs score). Bot level sets how many clues you start with. Every puzzle has exactly one solution.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "amaze": "<p><b>How to play<\/b><br>swipe or use arrow keys / WASD. The ball rolls until it hits a wall. Paint every tile to clear the level. Fewer extra moves = more points. Every maze is generated from a real solution, so it is always solvable.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "c4": "<p><b>How to play<\/b><br>drop discs and connect four in any direction. Tap or click a column. Starter alternates each round. Play the bot or a friend on this device.<\/p><p><b>Players<\/b> Pick Bots or Friends (same device) in the lobby, then press Start.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "paper": "<p><b>How to play<\/b><br>swipe or use arrow keys / WASD. Leave your land, draw a loop and come back home to claim everything inside. Anyone who touches a trail erases its owner. Own 45% of the map to win.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "gd": "<p><b>How to play<\/b><br>tap, click or hold Space / Up to jump. Land on blocks, clear spikes and gaps, reach the end of the level. Bot level sets the speed.<\/p><p><b>Tip<\/b> Change the Bot level on the menu for an easier or harder game. Your best score is saved on the menu card.<\/p>", "g2048": "<p><b>Goal<\/b> Slide the numbered tiles on the 4x4 board. Two equal tiles that touch merge into one with double the value. Build a 2048 tile to win.<\/p><p><b>Controls<\/b> Swipe, or use the Arrow keys / WASD. Every tile slides as far as it can in that direction.<\/p><p><b>Rules<\/b> After every move a new 2 (sometimes a 4) appears. A tile merges once per move. Each merge adds its new value to your score. You lose when the board is full and nothing can merge.<\/p><p><b>Tips<\/b> Keep your biggest tile in a corner and keep one row full. Avoid swiping the opposite way unless you must.<\/p>", "pacman": "<p><b>Goal<\/b> Eat every dot in the maze without being caught by the four ghosts. Clearing the maze starts a faster level. You have 3 lives.<\/p><p><b>Controls<\/b> Swipe anywhere or use the Arrow keys / WASD. Pac-Man keeps moving and takes your turn at the next opening. You can reverse at any time.<\/p><p><b>Scoring<\/b> Dot 10. Power dot 50. Eating ghosts in one power-up: 200, 400, 800, 1600. Eaten ghosts return home as eyes.<\/p><p><b>Ghosts<\/b> Red chases you, pink aims ahead of you, cyan flanks, orange wanders away when close. They switch between scatter and chase.<\/p><p><b>Tips<\/b> Use the side tunnel to escape. Save power dots until ghosts are close.<\/p>", "mole": "<p><b>Goal<\/b> Whack as many moles as you can in 45 seconds.<\/p><p><b>Controls<\/b> Tap or click a mole as it pops up.<\/p><p><b>Moles<\/b> Brown mole 10 points. Hard-hat mole needs two hits (25). Golden mole is fast and worth 50.<\/p><p><b>Combo<\/b> Consecutive hits add bonus points. Hitting empty grass or letting a mole escape resets the combo.<\/p><p><b>Tips<\/b> Moles get faster over time, and the Bot level sets the base speed. Do not spam taps: misses break your combo.<\/p>", "tetris": "<p><b>Goal<\/b> Stack falling pieces to fill complete rows. Full rows clear and score points. The game ends when the stack reaches the top.<\/p><p><b>Controls<\/b> Keyboard: Left/Right or A/D move, Down or S soft drop, Up or X rotate, Z rotate back, Space hard drop, C or Shift hold. Touch: use the on-screen buttons (hold the arrows to repeat).<\/p><p><b>Scoring<\/b> 1/2/3/4 rows = 100/300/500/800 x level. Soft drop +1 and hard drop +2 per row. Level rises every 10 lines; the Bot level sets your starting level.<\/p><p><b>Tips<\/b> The outline shows where the piece will land. Hold an I piece for a 4-row Tetris. You can slide a piece for half a second after it lands.<\/p>", "doodle": "<p><b>Goal<\/b> Bounce as high as you can. Falling off the bottom ends the run.<\/p><p><b>Controls<\/b> Hold the left or right half of the screen, or use Left/Right or A/D. You bounce on your own and wrap around the side edges.<\/p><p><b>Platforms<\/b> Green is solid. Blue slides sideways. Brown crumbles and gives no bounce. Springs launch you very high.<\/p><p><b>Score<\/b> Your height. Gaps and trick platforms increase the higher you climb.<\/p>", "ninja": "<p><b>Goal<\/b> Slice the flying fruit and never touch a bomb.<\/p><p><b>Controls<\/b> Drag quickly across fruit with your finger (or mouse).<\/p><p><b>Scoring<\/b> +1 per fruit. Slice 3 or more in one swipe for a combo bonus equal to the count.<\/p><p><b>Lives<\/b> Each fruit that falls uncut costs one of your 3 lives. Slicing a bomb ends the game at once.<\/p><p><b>Tips<\/b> Long, fast swipes hit several fruit. Bombs appear more often over time, so look before you swipe.<\/p>", "hill": "<p><b>Goal<\/b> Drive as far as you can over the hills. Collect coins and fuel cans.<\/p><p><b>Controls<\/b> Right / D / Up or the GAS pedal accelerates. Left / A / Down or the BRAKE pedal brakes and reverses. In the air, gas tilts the nose up and brake tilts it down.<\/p><p><b>Fuel<\/b> The gauge drains faster while you accelerate. Drive through red fuel cans to refill. With an empty tank you coast until you stop.<\/p><p><b>Game over<\/b> Your head touches the ground, or you run out of fuel and stop.<\/p><p><b>Score<\/b> Distance in metres plus 10 per coin.<\/p><p><b>Tips<\/b> Ease off the gas on steep climbs to avoid flipping backwards, and use air control to land on your wheels.<\/p>"};
Object.assign(HELP,{"throw":'<p style="font-size:30px;letter-spacing:6px">⬇️ ↔️ ✋ 🥫💥</p><p><b>Goal</b> Knock cans off the table. Every can that falls or topples scores 1 point. Best score after 2 rounds wins.</p><p><b>Controls</b><br>Press and drag <b>down</b> to charge power. Drag <b>left or right</b> to aim (pull left to throw right). The dotted arc shows the flight. Release to throw. You get 3 balls per turn.</p><p><b>How to win</b> Aim low so the bottom row goes first and the whole stack collapses. About half power usually lands on the cans.</p>'});
const VIS={"ttt": "👆~Tap a square|❌⭕~Take turns|➖~Line up 3|🏆~First line wins", "rps": "👆~Pick one|✊✋✌️~Rock, Paper, Scissors|🔁~Play rounds|🏆~Win more rounds", "bird": "👆~Tap to flap|🐦~Fly up and down|🟩~Pass the pipes|🏆~Longest run", "shots": "⏱️~Watch the meter|👆~Tap to shoot|🏀~Arc meets hoop|🏆~Score, avoid misses", "drift": "👆~Tap to turn|🏎️~Car drives itself|↩️~Turn at corners|🏆~Go farther", "snow": "⬅️➡️~Steer|🌲~Dodge trees|🎁~Grab gifts|🏆~Top score", "mem": "👆~Flip 2 cards|🃏~Find a match|🔁~Match = go again|🏆~Most pairs", "snake": "👆~Swipe or arrows|🍎~Eat apples|🧱~Avoid walls and tail|🏆~Grow longest", "chess": "👆~Tap piece, then square|♞~Pieces move by rules|⚠️~Check the king|🏆~Checkmate", "darts": "👆~Tap to throw|🎯~Aim the crosshair|✖️~Doubles, trebles|🏆~Top score", "archery": "✊~Hold to draw|🌬️~Watch the wind|🏹~Release to shoot|🏆~Hit the bullseye", "pool": "👆~Drag back from cue ball|🎱~Release to shoot|🕳️~Pot all nine|🏆~Fewest shots", "race": "↕️~Steer up or down|⚡~Tap NITRO|🏎️~Pass 3 rivals|🏆~Finish first", "foot": "👆~Tap goal to aim|⚽~Shoot or save|🔁~5 kicks each|🏆~Score more", "wordle": "⌨️~Type 5 letters|🟩~Green: right spot|🟨~Yellow: wrong spot|🏆~Solve in 6 tries", "dino": "👆~Tap or Space: jump|⬇️~Duck birds|🌵~Dodge cacti|🏆~Run farther", "boba": "🧋~Read the order|🛠️~Tea, topping, sugar|🔔~Tap Serve|🏆~Fast + combos", "triad": "🃏~Place a card|➡️~Higher number flips|🔄~Flip cards to you|🏆~Most cards", "pazaak": "🎴~Draw 1 to 10|➕➖~Side card|✋~End turn|🏆~Closest to 20", "fillet": "👀~Watch the knife|🔪~Repeat the pattern|👆~Tap the gaps|🏆~No slips", "bump": "🕹️~Drag to roll|💨~Double-tap: dash|💥~Bump rivals|🏆~Last one standing", "bed": "🕹️~Drag to move|🧱~Bridge gaps|🛏️~Break enemy bed|🏆~Knock them off", "fuzion": "🎮~3 mini-games|🏃~Sprint, coins, dodge|🏅~4/3/2/1 points|🏆~Most points", "sudoku": "👆~Tap a cell|🔢~Tap a number|🟥~Red = wrong|🏆~Fill the grid", "amaze": "👆~Swipe or arrows|⚪~Ball rolls to a wall|🎨~Paint every tile|🏆~Clear the maze", "c4": "👆~Tap a column|🔴🟡~Drop discs|➖~Connect four|🏆~Any direction", "paper": "👆~Swipe to steer|➡️~Leave your land|🔁~Loop back home|🏆~Claim most land", "gd": "👆~Tap or Space: jump|🔺~Clear spikes|🟦~Land on blocks|🏆~Reach the end", "g2048": "👆~Swipe or arrows|🔢~Equal tiles merge|➕~Build bigger|🏆~Reach 2048", "pacman": "🕹️~Arrows or swipe|⚪~Eat every dot|👻~Dodge ghosts|🏆~Clear the maze", "mole": "👆~Tap a mole|🔨~Whack fast|⏱️~45 seconds|🏆~Most moles", "tetris": "⬅️➡️~Move|🔄~Rotate|🧱~Fill rows|🏆~Clear rows", "doodle": "⬅️➡️~Hold left or right|⬆️~Bounce up|🟩~Land on platforms|🏆~Climb highest", "ninja": "👆~Drag across fruit|🍉~Slice it|💣~Avoid bombs|🏆~Slice the most", "hill": "⛽~Gas right, brake left|🪙~Grab coins|🛢️~Grab fuel|🏆~Go farthest", "slide": "👆~Tap a tile by the gap|➡️~It slides over|🔢~Order 1 to 15|🏆~Solve it", "mathq": "🧮~Read the sum|👆~Tap the answer|⏱️~60 seconds|🏆~Most points"};
const vis=id=>{const v=VIS[id];return v?'<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px">'+v.split("|").map((x,i,a)=>{const[e,t]=x.split("~");return'<div style="flex:1;min-width:0;padding:8px 3px;border-radius:12px;background:rgba(255,255,255,.1);text-align:center;'+(i==a.length-1?'outline:2px solid #4ade80;':'')+'"><div style="font-size:24px">'+e+'</div><div style="font-size:11px;margin-top:4px">'+t+'</div></div>'}).join("")+'</div>':""};
Object.assign(VIS,{"rope": "👆~Tap fast|🧑~You pull left|🤖~Bot pulls right|🏆~Flag reaches your side", "dots": "👆~Tap a line|🔲~Close a box|🔁~Box = extra turn|🏆~Most boxes", "candy": "👆~Tap, then a neighbour|🍓🍓🍓~Match 3 or more|⛓️~Chains multiply|🏆~1500 points", "pong": "↕️~Move your paddle|🏓~Return the ball|📈~Ball speeds up|🏆~First to 7", "chaos": "👆~Tap the orb|💰~Gold +25|💣~Avoid bombs|🏆~Highest score"});Object.assign(HELP,{"rope": "<p><b>Goal</b> Drag the flag all the way to your side before the bot drags it to theirs.</p><p><b>Controls</b> Tap or click anywhere, or press Space, as fast as you can.</p><p><b>How to win</b> Keep a steady fast rhythm. The bot pulls in waves, so tap hardest when it eases off. Higher bot levels pull harder.</p>", "dots": "<p><b>Goal</b> Claim more boxes than the bot.</p><p><b>Controls</b> Tap the gap between two dots to draw a line. When you close the fourth side of a box it becomes yours and you go again.</p><p><b>How to win</b> Never draw the third side of a box, because that hands it to the bot. Take every box you can, and save long chains for the end.</p>", "candy": "<p><b>Goal</b> Reach 1500 points in 25 moves.</p><p><b>Controls</b> Tap a fruit, then tap a neighbouring fruit to swap them. Only swaps that make a match of 3 or more count as a move.</p><p><b>How to win</b> Matches of 4 or more score more, and chain reactions multiply your points. Work near the bottom so more matches cascade. Unused moves add bonus points.</p>", "pong": "<p><b>Goal</b> Be first to 7 points.</p><p><b>Controls</b> Move the pointer or your finger up and down, or use W / S or the arrow keys.</p><p><b>How to win</b> Hit the ball with the edge of your paddle for sharper angles. The ball gets faster with every hit, so stay centred and read its bounce.</p>", "chaos": "<p><b>Goal</b> Score as much as you can in 40 seconds.</p><p><b>Controls</b> Tap the blue orb. Tap gold 💰 for +25. Do not tap bombs 💣: they cost 20 points and reset your combo.</p><p><b>How to win</b> Your combo multiplier grows every 5 taps, but the orb shrinks and jumps around. Stay calm and tap fast without hitting bombs.</p>"});
Object.assign(VIS,{"zerog": "👆~Tap or Space|🪐~Flip floor and ceiling|🔺~Dodge spikes|🏆~Run farthest", "quantum": "👆~Tap or Space|🟦🟪~Switch phase|🧱~Other colours are solid|🏆~Run farthest", "void": "⬅️➡️~Change lane|☄️~Dodge asteroids|🔷~Grab orbs|🏆~Fly farthest", "fmerge": "👆~Aim, then release|🍒🍒~Equal fruits merge|⬆️~Grow bigger fruit|🏆~Do not overflow", "arrow": "👆~Tap an arrow|➡️~Clear path: it flies out|🧱~Blocked costs a heart|🏆~Clear every arrow", "mbox": "👆~Open a box|💰~Adds to the pot|💣~Bomb wipes the pot|🏆~Bank before you bust"});Object.assign(HELP,{"zerog": "<p><b>Goal</b> Run as far as you can without touching a spike.</p><p><b>Controls</b> Tap, click or press Space to flip gravity between the floor and the ceiling.</p><p><b>How to win</b> Spikes come from both sides. Flip early to the safe side, and flip back as soon as you pass. The run gets faster over time.</p>", "quantum": "<p><b>Goal</b> Run as far as you can through the walls.</p><p><b>Controls</b> Tap, click or press Space to switch your phase between blue and pink.</p><p><b>How to win</b> A wall of your own colour is a ghost and lets you through. A wall of the other colour is solid and ends the run. Look ahead and switch to match the next wall.</p>", "void": "<p><b>Goal</b> Fly as far as you can through the asteroid field.</p><p><b>Controls</b> Tap the left or right half of the screen, or use the arrow keys / A and D, to change lane.</p><p><b>How to win</b> Every row leaves one lane free. Stay ahead of the rocks and grab blue orbs for a distance bonus.</p>", "fmerge": "<p><b>Goal</b> Merge fruits to reach the watermelon and score high.</p><p><b>Controls</b> Move your pointer or finger to aim, then release or click to drop. On a keyboard use the arrows and Space.</p><p><b>How to win</b> Two equal fruits that touch merge into the next fruit. Keep big fruits in a corner and do not let a pile stay above the red line for long.</p>", "arrow": "<p><b>Goal</b> Clear every arrow on all 3 levels.</p><p><b>Controls</b> Tap an arrow. If nothing is in its way to the edge, it flies off.</p><p><b>How to win</b> Look at each arrow's direction and find ones with a free path first. Blocked taps cost a heart, and you have 3.</p>", "mbox": "<p><b>Goal</b> Collect the most points over 5 rounds.</p><p><b>Controls</b> Tap a box to open it. Tap BANK to keep the pot.</p><p><b>How to win</b> Coins grow the pot and ✖️2 doubles it. A bomb wipes the pot and ends the round, so bank when the pot is big. Later rounds have more bombs.</p>"});
Object.assign(VIS,{"ghost": "👆~Tap ghosts|🏮~Guard the lantern|😇~Never tap wisps|🏆~Keep your 3 lives", "strike": "⏳~Wait for the signal|⚡~STRIKE appears|👆~Tap first|🏆~Win 3 rounds", "dpix": "👆~Tap a pixel|🔁~It flips neighbours|🔳~Make all dark|🏆~Fewest moves", "glitch": "👀~Scan the tiles|🧬~Spot the odd one|👆~Tap it|🏆~Most in 45 s", "hchaos": "🔎~Read the target|🌀~Search the clutter|👆~Tap it|🏆~Most in 60 s", "sprint": "⬅️➡️~Alternate sides|🏃~Each step moves you|⚠️~Same side stumbles|🏆~Reach 100 m first", "golf": "👆~Press, pull back|⛳~Release to putt|🧱~Bounce off walls|🏆~Sink it in few strokes"});Object.assign(HELP,{"ghost": "<p><b>Goal</b> Banish ghosts before they reach the lantern and survive with your 3 hearts.</p><p><b>Controls</b> Tap or click a ghost 👻 to banish it for 10 points.</p><p><b>How to win</b> Do not tap the friendly wisps 😇, because that costs a heart. A ghost that reaches the lantern also costs a heart. Ghosts get faster and more frequent over time.</p>", "strike": "<p><b>Goal</b> Win 3 rounds, or more rounds than the phantom, in a best of 5.</p><p><b>Controls</b> Tap or press Space.</p><p><b>How to win</b> Wait for the red STRIKE! signal, then tap before the phantom. Tapping early loses the round. Higher bot levels react faster.</p>", "dpix": "<p><b>Goal</b> Turn every glowing pixel dark on all 3 levels.</p><p><b>Controls</b> Tap a pixel. It flips, and so do the pixels above, below, left and right of it.</p><p><b>How to win</b> Work from the top row down: fix each row by tapping the pixel under any lit one. Fewer moves score more.</p>", "glitch": "<p><b>Goal</b> Find the one tile that is slightly lighter than the rest.</p><p><b>Controls</b> Tap the odd tile.</p><p><b>How to win</b> You have 45 seconds and a wrong tap costs 3 seconds. Each find makes the grid bigger and the difference smaller, so look at the whole board at once.</p>", "hchaos": "<p><b>Goal</b> Find the target animal hidden in the clutter.</p><p><b>Controls</b> Tap it. The target is shown at the top.</p><p><b>How to win</b> You have 60 seconds and a wrong tap costs 2 seconds. Every find adds more clutter, so scan in rows instead of jumping around.</p>", "sprint": "<p><b>Goal</b> Run 100 m before the 3 bots do.</p><p><b>Controls</b> Alternate left and right: arrow keys or A and D, or tap the left and right side of the screen.</p><p><b>How to win</b> Each switch of side moves you forward. Pressing the same side twice makes you stumble, so keep a steady left-right rhythm.</p>", "golf": "<p><b>Goal</b> Sink the ball in each of the 3 holes with as few strokes as possible.</p><p><b>Controls</b> Press anywhere and pull back like a slingshot. The dotted line shows the direction and the bar shows power. Release to putt.</p><p><b>How to win</b> Use the walls to bank shots around the wooden blocks. A ball moving too fast rolls over the hole, so use less power near it. 8 strokes is the limit per hole.</p>"});
Object.assign(VIS,{"maze": "⌨️~Arrows, swipe or tap|🔦~Fog hides the maze|🧭~Find the green exit|🏆~Clear 4 mazes", "fduel": "↔️~Move your basket|🍎~Catch fruit|💣~Avoid bombs|🏆~Beat the bot", "chicken": "↔️~Move your tractor|🔫~It fires by itself|🥚~Dodge eggs|🏆~Clear the waves", "yazy": "🎲~Roll 5 dice|👆~Tap dice to hold|📝~Pick a category|🏆~Highest total", "nuts": "👆~Tap a bolt|🔩~Move the top nut|🎨~Same colour or empty|🏆~One colour per bolt"});Object.assign(HELP,{"maze": "<p><b>Goal</b> Reach the glowing green exit in the bottom-right corner before the timer ends. There are 4 mazes, each bigger than the last.</p><p><b>Controls</b> Arrow keys or WASD, or swipe/tap in the direction you want to go.</p><p><b>How to win</b> The fog hides most of the maze, so follow one wall with your hand and note the dead ends. Time left over adds bonus points.</p>", "fduel": "<p><b>Goal</b> Catch more fruit than the bot in 45 seconds.</p><p><b>Controls</b> Move the pointer or your finger, or use the left and right arrows, to slide your basket on the left half.</p><p><b>How to win</b> The bot catches the same fruit on the right. 🍎🍌 give 10, 🍇 gives 15 and falls fast, 🌟 gives 30, and 💣 costs 20. Always go for the lowest fruit and dodge the bombs.</p>", "chicken": "<p><b>Goal</b> Shoot every chicken in each wave and survive with your 3 hearts.</p><p><b>Controls</b> Move your tractor with the pointer, your finger, or the arrow keys. It shoots by itself.</p><p><b>How to win</b> Dodge the falling eggs and do not let the chickens come down to your level. Chickens with a red ring need two hits. Waves get faster.</p>", "yazy": "<p><b>Goal</b> Finish all 13 categories with the highest total.</p><p><b>Controls</b> Tap Roll. After a roll, tap dice to hold them and roll again, up to 3 rolls. Then tap a category to score it.</p><p><b>How to win</b> Aim for 63 or more in the top six rows to get a 35 bonus. Yazy (5 alike) is 50, a large straight 40, a small straight 30 and a full house 25. Use Chance for a bad roll.</p>", "nuts": "<p><b>Goal</b> Sort the nuts so every bolt holds only one colour. There are 3 levels.</p><p><b>Controls</b> Tap a bolt to lift its top nut, then tap another bolt to place it. Each bolt holds 4 nuts. Tap Undo to step back.</p><p><b>How to win</b> A nut can go on an empty bolt or on one with the same colour on top. Keep one empty bolt free as long as you can, and use fewer moves for more points.</p>"});
Object.assign(VIS,{"bubble": "👆~Aim, then release|🫧~Match 3 or more|🍇~Loose bubbles fall|🏆~Clear the board", "havoc": "↔️~Move the paddle|🧱~Bounce the ball|⭐~Catch power-ups|🏆~Break every brick", "inf": "👆~Tap or Space|↕️~Switch path up or down|🟣~Stay in the tunnel|🏆~Escape farthest", "turbo": "⏱️~Wait for GO|👆~Tap to shift up|🟩~Shift in the green|🏆~Reach 400 m first", "neon": "🕹️~Move: pointer or WASD|🔫~It fires by itself|👾~Dodge enemies|🏆~Survive longest"});Object.assign(HELP,{"bubble": "<p><b>Goal</b> Pop every bubble before they reach the red line.</p><p><b>Controls</b> Move your pointer or finger to aim, then release or click to shoot. On a keyboard use the arrow keys and Space. Shots bounce off the side walls.</p><p><b>How to win</b> Groups of 3 or more of the same colour pop. Anything left hanging loose falls and scores extra, so aim for bubbles that hold up big clusters. Two new rows drop every 8 shots.</p>", "havoc": "<p><b>Goal</b> Break all the bricks on 3 levels without losing your 3 hearts.</p><p><b>Controls</b> Move the pointer, your finger or the arrow keys to slide the paddle. Tap, click or press Space to launch the ball.</p><p><b>How to win</b> Where the ball hits the paddle sets its angle: hit it with the edge to steer. Top bricks take two hits. Catch W to widen the paddle, S to slow the ball, and + for an extra life.</p>", "inf": "<p><b>Goal</b> Fly as far as you can through the endless tunnel.</p><p><b>Controls</b> Tap, click or press Space to switch your path between going up and going down.</p><p><b>How to win</b> Switch just before you touch a wall. The tunnel narrows and speeds up over time, so keep your taps small and steady.</p>", "turbo": "<p><b>Goal</b> Win a 400 m drag race against the bot.</p><p><b>Controls</b> Tap or press Space to shift up. The bar shows your engine revs.</p><p><b>How to win</b> Shift when the bar is in the green zone for a speed boost. Shifting too early or at the red end of the bar slows you down. You have 5 gears. Higher bot levels shift better.</p>", "neon": "<p><b>Goal</b> Survive as long as you can and destroy as many enemies as possible.</p><p><b>Controls</b> Move with your pointer or finger, or use WASD or the arrow keys. Your ship fires at the nearest enemy automatically.</p><p><b>How to win</b> Keep moving and do not let enemies touch you. You have 5 hearts. Small yellow enemies are fast but worth more points, and tougher ones appear later.</p>"});
Object.assign(VIS,{"pong3": "↔️↕️~Move the paddle|🏓~Hit the ball back|⚡~Swipe fast for deep shots|🏆~First to 7", "cup3": "👆~Press and pull down|🎯~Dotted arc = flight|🥤~Land it in a cup|🏆~Sink all 10 cups", "soccer": "👆~Pull a disc back|⚽~Release to flick|🥅~Hit the ball in the goal|🏆~First to 3 goals", "phantom": "👀~Watch the phantom|🔳~Pixels light in order|👆~Repeat the order|🏆~Longest sequence", "realm": "👆~Tap to explore|🔢~Numbers count monsters|🚩~Flag suspects|🏆~Reveal all safe tiles"});Object.assign(HELP,{"pong3": "<p><b>Goal</b> Win 7 points against the bot.</p><p><b>Controls</b> Move your pointer or finger to move the red paddle in the air above your end of the table. Tap to serve when it says so.</p><p><b>How to win</b> Put your paddle in front of the ball as it comes over the net. Hit it with the left or right side of the paddle to send it the other way, and swipe faster for a deeper, quicker shot. Let it bounce on your side first.</p>", "cup3": "<p><b>Goal</b> Land the ball in all 10 cups using 10 throws.</p><p><b>Controls</b> Press and drag down to charge power, drag left or right to aim, then release. The dotted arc shows the flight.</p><p><b>How to win</b> About 40% power lands near the cups. Aim for the front cup first. A ball that touches a rim bounces away, and a ball that bounces on the table can still drop into a cup. Each cup is worth 10 points.</p>", "soccer": "<p><b>Goal</b> Score 3 goals before the bot does.</p><p><b>Controls</b> Press one of your blue discs, pull back like a slingshot, and release to flick. Further pull means a harder flick.</p><p><b>How to win</b> You each flick one disc per turn, and the turn passes when everything stops. Line up so your disc hits the ball toward the right-hand goal. Keep a disc near your own goal to block shots.</p>", "phantom": "<p><b>Goal</b> Repeat the phantom's pixel sequence for as many rounds as you can.</p><p><b>Controls</b> Watch the pixels light up, then tap them in the same order.</p><p><b>How to win</b> The sequence grows by one pixel each round and gets faster. Say the positions to yourself, for example top-left, centre, bottom-right.</p>", "realm": "<p><b>Goal</b> Reveal every tile that has no monster.</p><p><b>Controls</b> Tap a tile to explore it. Press the flag button to switch to flag mode, then tap tiles to mark monsters with a flag.</p><p><b>How to win</b> A number shows how many of the 8 touching tiles hold monsters. Use the numbers to work out which tiles are safe. Your first tap is always safe. There are 10 monsters.</p>"});
Object.assign(VIS,{"solitaire": "👆~Tap a card, then a spot|🂡~Stack down, colours alternate|🏠~Build A to K by suit|🏆~Fill all 4 piles", "shadow": "🕹️~Move: pointer or WASD|👁️~Avoid yellow cones|🟣~Dark zones hide you|🏆~Reach the green exit", "pquest": "⌨️~Arrows or tap a side|🗝️~Collect all 3 keys|👻~Bump phantoms away|🏆~Enter the portal"});Object.assign(HELP,{"solitaire": "<p><b>Goal</b> Move all 52 cards onto the 4 piles at the top right, one pile per suit, from Ace up to King.</p><p><b>Controls</b> Tap the stock (top left) to turn over a card. Tap a face-up card to pick it up, then tap the column or pile where it should go. Tap a picked card again to send it to its pile. A card picked from a column takes the cards below it too. Tap the ↺ circle to reuse the waste cards.</p><p><b>How to win</b> In the columns, build downward in alternating colours (red 6 on black 7). Only a King can go in an empty column. Turn over hidden cards early and free up Aces. Winning scores bonus points for speed.</p>", "shadow": "<p><b>Goal</b> Get from the left edge to the green exit on the right in all 4 levels without being spotted. You have 3 hearts.</p><p><b>Controls</b> Move with your pointer or finger, or use WASD or the arrow keys.</p><p><b>How to win</b> Guards patrol up and down, and the yellow cone in front of them spots you. Wait behind a guard, then slip across. Dark purple zones hide you completely and let you move faster. Fast clears score time bonus points.</p>", "pquest": "<p><b>Goal</b> Clear 3 floors: pick up all 3 keys 🗝️ on each floor, then step into the portal 🌀.</p><p><b>Controls</b> Arrow keys or WASD, or tap a tile on the side of your wizard you want to move toward. Each step is one turn.</p><p><b>How to win</b> Phantoms 👻 chase you when you get close. Move into one to banish it safely. If one reaches you it costs a heart, and you start with 3. Potions 🧪 give a heart back. Use walls to slow the phantoms down.</p>"});
Object.assign(HELP,{slide:'<p><b>Goal</b> Put the tiles 1 to 15 in order, with the gap in the bottom-right corner.</p><p><b>Controls</b> Tap a tile in the same row or column as the gap to slide it, or use arrow keys / WASD.</p><p><b>How to win</b> Solve the top row first, then the next row, then the last two rows together. Fewer moves and less time score more.</p>',mathq:'<p><b>Goal</b> Answer as many sums as you can in 60 seconds.</p><p><b>Controls</b> Tap an answer, or press 1 to 4.</p><p><b>How to win</b> Each right answer scores 10 plus a streak bonus. A wrong answer breaks the streak and costs 3 seconds. Bot level sets how big the numbers are.</p>'});

{const lm=s=>{const m=s.match(/[\d.]+/g)||[];return(.299*m[0]+.587*m[1]+.114*m[2])/255},

const BarricadeRules=(()=>{const inside=p=>p.x>=0&&p.y>=0&&p.x<9&&p.y<9,dirs=[[1,0],[-1,0],[0,1],[0,-1]],blocked=(a,b,ws)=>ws.some(w=>w.o==='h'?a.x===b.x&&Math.min(a.y,b.y)===w.y&&a.y!==b.y&&(a.x===w.x||a.x===w.x+1):a.y===b.y&&Math.min(a.x,b.x)===w.x&&a.x!==b.x&&(a.y===w.y||a.y===w.y+1)),neighbors=(p,ws)=>dirs.map(([x,y])=>({x:p.x+x,y:p.y+y})).filter(q=>inside(q)&&!blocked(p,q,ws)),path=(p,goal,ws)=>{const queue=[{...p,d:0}],seen=new Set([p.y*9+p.x]);for(let i=0;i<queue.length;i++){const a=queue[i];if(a.y===goal)return a.d;for(const q of neighbors(a,ws)){const k=q.y*9+q.x;if(!seen.has(k)){seen.add(k);queue.push({...q,d:a.d+1})}}}return Infinity},moves=(ps,t,ws)=>{const p=ps[t],opp=ps[1-t],out=[];for(const q of neighbors(p,ws)){if(q.x!==opp.x||q.y!==opp.y){out.push(q);continue}const dx=q.x-p.x,dy=q.y-p.y,j={x:q.x+dx,y:q.y+dy};if(inside(j)&&!blocked(q,j,ws))out.push(j);else for(const a of neighbors(q,ws))if((a.x-q.x)*dx+(a.y-q.y)*dy===0)out.push(a)}return out},valid=(w,ws,ps)=>w.x>=0&&w.y>=0&&w.x<8&&w.y<8&&!ws.some(a=>a.o===w.o?(a.o==='h'?a.y===w.y&&Math.abs(a.x-w.x)<2:a.x===w.x&&Math.abs(a.y-w.y)<2):a.x===w.x&&a.y===w.y)&&ps.every((p,i)=>isFinite(path(p,i?8:0,[...ws,w])));return{blocked,neighbors,path,moves,valid}})();
addGame({id:'barricade',name:'Barricade',icon:'🧱',tags:['Board','Strategy','Vs Bot','Multiplayer'],mp:[2,2],start(c){

 const board=c.el.querySelector('#bboard'),err=c.el.querySelector('#berr'),stat=c.el.querySelector('#bstatus'),buttons=['bm','bh','bv'].map(id=>c.el.querySelector('#'+id));
 const draw=()=>{board.innerHTML='';const legal=R.moves(ps,turn,ws);for(let y=0;y<9;y++)for(let x=0;x<9;x++){const b=document.createElement('button'),who=ps.findIndex(p=>p.x===x&&p.y===y),ok=legal.some(p=>p.x===x&&p.y===y);b.style.cssText=`position:absolute;left:${x/9*100}%;top:${y/9*100}%;width:10%;height:10%;padding:0;border-radius:18%;background:${y===0?'#663333':y===8?'#253e65':'#293342'}!important;box-shadow:inset 0 2px 3px #fff2!important;font-size:min(4vh,24px);transition:transform .15s`;b.textContent=who===0?'🔴':who===1?'🔵':mode==='move'&&ok?'·':'';b.setAttribute('aria-label',`Row ${y+1}, column ${x+1}${who>=0?', pawn '+(who+1):''}`);b.onclick=()=>act({x,y});board.appendChild(b)}
 ws.forEach(w=>{const d=document.createElement('div');d.style.cssText=`position:absolute;pointer-events:none;border-radius:6px;background:linear-gradient(135deg,#ffdc8b,#9a5d25);box-shadow:0 2px 3px #0008;left:${(w.x+(w.o==='v'?.9:0))/9*100}%;top:${(w.y+(w.o==='h'?.9:0))/9*100}%;width:${(w.o==='h'?1.9:.1)/9*100}%;height:${(w.o==='h'?.1:1.9)/9*100}%`;board.appendChild(d)});
 buttons.forEach((b,i)=>b.className=mode===['move','h','v'][i]?'on':'');stat.textContent=c.pl[turn].n+' · '+left[turn]+' walls';c.hud(c.pl[0].n+' 🔴 '+left[0]+' walls · '+c.pl[1].n+' 🔵 '+left[1]+' walls');};
 const next=()=>{if(ps[turn].y===(turn?8:0)){done=true;draw();c.t(()=>c.over(c.pl[turn].n+' reached the goal!',100),400);return}turn=1-turn;mode='move';draw();if(c.pl[turn].bot){busy=true;c.t(bot,400)}};
 const act=p=>{if(done||busy||PZ)return;err.textContent='';if(mode==='move'){if(!R.moves(ps,turn,ws).some(q=>q.x===p.x&&q.y===p.y)){err.textContent='Tap a marked legal square.';return}ps[turn]=p}else{const w={...p,o:mode};if(!left[turn]||!R.valid(w,ws,ps)){err.textContent='Wall refused: no crossing, overlap, or blocked routes.';return}ws.push(w);left[turn]--}next()};
 const bot=()=>{if(done)return;const me=turn,opp=1-me,goal=me?8:0,og=opp?8:0,choices=R.moves(ps,me,ws).sort((a,b)=>R.path(a,goal,ws)-R.path(b,goal,ws));let wall=null,gain=0;const md=R.path(ps[me],goal,ws),od=R.path(ps[opp],og,ws);if(left[me]&&Math.random()>[.8,.5,.25,.1][c.lv])for(let y=0;y<8;y++)for(let x=0;x<8;x++)for(const o of['h','v']){const w={x,y,o};if(!R.valid(w,ws,ps))continue;const score=R.path(ps[opp],og,[...ws,w])-od-(R.path(ps[me],goal,[...ws,w])-md)*1.2;if(score>gain){gain=score;wall=w}}if(wall&&gain>=1){ws.push(wall);left[me]--}else if(choices.length)ps[me]=choices[c.lv===0&&Math.random()<.25?Math.random()*choices.length|0:0];busy=false;next()};
 buttons.forEach((b,i)=>b.onclick=()=>{if(busy||done)return;mode=['move','h','v'][i];err.textContent=mode==='move'?'Tap a marked square.':'Tap the upper-left cell beside a two-cell wall. A wall is placed below it (↔) or to its right (↕).';draw()});draw();
}});
